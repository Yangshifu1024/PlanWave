[package]
name = "sync-core"
description = "PlanWave 同步内核：oplog 操作模型、字段级合并语义、Lamport 时钟与全序重放（纯 Rust，无 IO 依赖）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

# wasm32 下 Op::new 的时间戳取自 JS Date（std::time 在 wasm32-unknown-unknown 不可用）
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
rand = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
