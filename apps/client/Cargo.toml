[package]
name = "planwave"
description = "PlanWave 桌面/移动端（Tauri 2 壳）：窗口 + 本地通知；数据层统一走 WASM 同步引擎"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "planwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：系统托盘（仅桌面使用，移动目标内部自动忽略）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
# generate_context! 宏（updater 插件配置）展开需要直接依赖 serde_json
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# 桌面专属：设置弹框的代理档位（同步 HTTP 桥 + 代理连通性测试）
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
sysproxy = "0.3"

# Android 专用：应用内下载新版 APK 并拉起系统安装器（见 src/update_apk.rs）
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
jni = "0.21"
ndk-context = "0.1"
# tauri 在 dev 下为 `tauri://` 协议处理器构建 reqwest 客户端时需要 rustls crypto
# provider（tauri 2.11.x 只在 https devUrl 分支安装它）。版本与 features 与上游 tauri
# 自身的声明一致，避免引入第二个 provider（aws-lc-rs）。
rustls = { version = "0.23", default-features = false, features = ["ring"] }
