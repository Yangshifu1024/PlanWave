# 发布流水线：只在 v* 标签触发。
# - server / web 构建并推送 Docker 镜像到 GHCR（semver + latest）
# - 五端客户端（Windows / macOS / Linux / Android / iOS）打包并上传 GitHub Release
# - macOS / iOS 签名与公证：见 docs/APPLE_SIGNING.md（配置对应 Secrets 即可；
#   未配置时对应平台自动跳过签名，产物仍会上传）
# - 桌面自动更新：配置 TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) 后（见 docs/AUTO_UPDATE.md），
#   桌面包带 minisign 签名并生成 latest.json 更新清单；未配置时自动跳过
name: Release

on:
  push:
    tags: ["v*"]

# 新标签推送时取消仍在跑的旧标签发布：镜像与产物以最新 tag 为准，
# 旧发布继续跑只会浪费构建时长并产出过时产物
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ---------- Docker 镜像 ----------

  docker-server:
    name: Docker 镜像（server）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/server.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

  docker-web:
    name: Docker 镜像（web）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ---------- 客户端打包（五端）----------

  web-dist:
    name: 前端产物（各客户端共用）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/sync-wasm --target wasm32-unknown-unknown
          key: wasm-release
      - run: pnpm install --frozen-lockfile
      - name: 构建 WASM 数据层
        run: pnpm build:wasm
      - name: 构建前端
        run: pnpm --filter @planwave/web build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 1

  desktop-windows:
    name: 客户端（Windows NSIS）
    runs-on: windows-latest
    needs: [web-dist]
    outputs:
      updater: ${{ steps.updater-flag.outputs.updater }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: 下载前端产物
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      - id: updater-flag
        name: 检测 updater 签名密钥
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: echo "updater=$([ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Tauri build（NSIS）
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS="--config tauri.ci.conf.json --bundles nsis"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            ARGS="$ARGS --config tauri.updater.conf.json"
          fi
          pnpm --filter @planwave/client exec tauri build $ARGS
      - uses: actions/upload-artifact@v7
        with:
          name: client-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  desktop-linux:
    name: 客户端（Linux AppImage/deb）
    runs-on: ubuntu-latest
    needs: [web-dist]
    outputs:
      updater: ${{ steps.updater-flag.outputs.updater }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Linux 打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: pnpm install --frozen-lockfile
      - name: 下载前端产物
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      - id: updater-flag
        name: 检测 updater 签名密钥
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: echo "updater=$([ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Tauri build（AppImage + deb）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARGS="--config tauri.ci.conf.json --bundles appimage,deb"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            ARGS="$ARGS --config tauri.updater.conf.json"
          fi
          pnpm --filter @planwave/client exec tauri build $ARGS
      - uses: actions/upload-artifact@v7
        with:
          name: client-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  desktop-macos:
    name: 客户端（macOS dmg，签名+公证）
    runs-on: macos-latest
    needs: [web-dist]
    outputs:
      updater: ${{ steps.updater-flag.outputs.updater }}
    env:
      # 映射成 job 级 env，供步骤 if 判断是否配置了签名
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: 下载前端产物
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      - id: updater-flag
        name: 检测 updater 签名密钥（仅在 Apple 签名可用时才产出 updater 产物）
        if: env.APPLE_CERTIFICATE != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: echo "updater=$([ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # 签名 + 公证配置见 docs/APPLE_SIGNING.md；未配置 Secrets 时跳过签名仍可出包
      - name: 导入 Developer ID 证书
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: release
        run: |
          CERTIFICATE=$RUNNER_TEMP/certificate.p12
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE
          KEYCHAIN=$RUNNER_TEMP/planwave.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security import $CERTIFICATE -k $KEYCHAIN -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security list-keychain -d user -s $KEYCHAIN login.keychain-db
      # 未配置签名 Secrets 时 APPLE_* 会是空字符串，tauri 会误判「要签名」，
      # 所以拆成互斥步骤。updater 需要 .app.tar.gz + minisign 签名（tauri.updater.conf.json），
      # 且仅在有 Apple 签名时产出（未签名 app 的自动更新在 macOS 上不可用）
      - name: Tauri build（universal dmg + app，签名+公证+updater）
        if: env.APPLE_CERTIFICATE != '' && steps.updater-flag.outputs.updater == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >
          pnpm --filter @planwave/client exec tauri build --target universal-apple-darwin
          --config tauri.ci.conf.json --config tauri.updater.conf.json --bundles dmg,app
      - name: Tauri build（universal dmg，签名+公证）
        if: env.APPLE_CERTIFICATE != '' && steps.updater-flag.outputs.updater != 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @planwave/client exec tauri build --target universal-apple-darwin --config tauri.ci.conf.json --bundles dmg
      - name: Tauri build（universal dmg，未签名）
        if: env.APPLE_CERTIFICATE == ''
        run: pnpm --filter @planwave/client exec tauri build --target universal-apple-darwin --config tauri.ci.conf.json --bundles dmg
      - uses: actions/upload-artifact@v7
        with:
          name: client-macos
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  android:
    name: 客户端（Android APK，签名）
    runs-on: ubuntu-latest
    needs: [web-dist]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: 下载前端产物
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      # APK 内部版本号对齐 tag：显式写 tauri.properties（gradle 读取 versionName/versionCode），
      # 不依赖 tauri CLI 的再生成行为
      - name: 写入 Android 版本号
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          cat > apps/client/gen/android/app/tauri.properties <<EOF
          tauri.android.versionName=${VERSION}
          tauri.android.versionCode=${CODE}
          EOF
          cat apps/client/gen/android/app/tauri.properties
      - name: Tauri android build（apk）
        env:
          TAURI_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/planwave.keystore
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_ANDROID_KEYSTORE_PASSWORD" ]; then
            echo -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode -o "$TAURI_ANDROID_KEYSTORE_PATH"
          fi
          pnpm --filter @planwave/client exec tauri android build --apk --config tauri.ci.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: client-android
          path: apps/client/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

  ios:
    name: 客户端（iOS ipa，Ad Hoc 签名）
    runs-on: macos-latest
    needs: [web-dist]
    env:
      # 映射成 job 级 env，供步骤 if 判断是否配置了签名
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: 下载前端产物
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist
      # iOS 工程由 macos runner 生成（Windows/Linux 无法 init）
      - name: Tauri ios init
        run: pnpm --filter @planwave/client exec tauri ios init
      - name: 导入 Ad Hoc 分发证书
        if: env.IOS_CERTIFICATE != ''
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: release
        run: |
          CERTIFICATE=$RUNNER_TEMP/ios.p12
          echo -n "$IOS_CERTIFICATE" | base64 --decode -o $CERTIFICATE
          KEYCHAIN=$RUNNER_TEMP/ios.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security import $CERTIFICATE -k $KEYCHAIN -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security list-keychain -d user -s $KEYCHAIN login.keychain-db
          PROFILE=$RUNNER_TEMP/profile.mobileprovision
          echo -n "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode -o $PROFILE
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< \
            "$(security cms -D -i $PROFILE 2>/dev/null)")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
      - name: Tauri ios build（Ad Hoc ipa）
        if: env.IOS_CERTIFICATE != ''
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
        run: pnpm --filter @planwave/client exec tauri ios build --export-method ad-hoc --config tauri.ci.conf.json
      # 未配置签名 Secrets 时给出未签名构建说明，不出 ipa
      - name: 未配置 iOS 签名提示
        if: env.IOS_CERTIFICATE == ''
        run: |
          echo "::notice::未配置 iOS 签名 Secrets（见 docs/APPLE_SIGNING.md），本次跳过 ipa 打包"

  release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: [docker-server, docker-web, desktop-windows, desktop-linux, desktop-macos, android]
    steps:
      - uses: actions/checkout@v7
        with:
          # 生成发布日志需要完整历史与上一个 tag
          fetch-depth: 0
      # 只取客户端产物（client-*）；buildx 自动上传的 *.dockerbuild 构建记录
      # 不需要，且全量下载在某些 artifact 上会反复重试失败
      - uses: actions/download-artifact@v8
        with:
          pattern: client-*
          merge-multiple: true
          path: release
      # merge-multiple 会保留各 artifact 内部的目录结构（appimage/ deb/ …），
      # 统一摊平到 upload/ 再上传；APK 按版本重命名（与其他端产物命名对齐）；
      # 桌面端 updater 签名文件（*.sig）与 macOS .app.tar.gz 一并摊平并统一命名，
      # 供 latest.json 引用（URL = Release 资产直链）
      - name: 整理产物
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p upload
          find release -type f \( \
            -name "*.exe" -o -name "*.exe.sig" -o \
            -name "*.AppImage" -o -name "*.AppImage.sig" -o \
            -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" -o \
            -name "*.deb" -o -name "*.dmg" -o -name "*.apk" \) \
            -exec cp {} upload/ \;
          for f in upload/*.apk; do
            [ -e "$f" ] || continue
            mv "$f" "upload/PlanWave_${VERSION}_universal.apk"
          done
          # tauri 的 NSIS/AppImage/app.tar.gz 产物已自带版本名：目标同名时跳过 mv
          # （bash -e 下 mv 同名文件会报错中断）
          rename_all() {
            local glob="$1" target="upload/PlanWave_${VERSION}_$2"
            for f in $glob; do
              [ -e "$f" ] || continue
              [ "$f" = "$target" ] || mv -f "$f" "$target"
            done
          }
          rename_all 'upload/*_x64-setup.exe' 'x64-setup.exe'
          rename_all 'upload/*_x64-setup.exe.sig' 'x64-setup.exe.sig'
          rename_all 'upload/*.app.tar.gz' 'aarch64.app.tar.gz'
          rename_all 'upload/*.app.tar.gz.sig' 'aarch64.app.tar.gz.sig'
          rename_all 'upload/*.AppImage' 'amd64.AppImage'
          rename_all 'upload/*.AppImage.sig' 'amd64.AppImage.sig'
          ls -la upload/
      # 直推 main 没有 PR，generate_release_notes 只会给出 Full Changelog 链接；
      # 这里显式列出与上一个 tag 之间的全部 commit，GitHub 自动生成的
      # 说明（含 Full Changelog）会追加在该正文之后
      - name: 生成发布日志
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${GITHUB_REF_NAME}"
            echo "范围: ${RANGE}"
          else
            RANGE="${GITHUB_REF_NAME}"
            echo "范围: 首个 tag，取全部历史"
          fi
          {
            echo "## 更新内容"
            git log --no-decorate --format='- %s (%h)' "$RANGE"
          } > body.md
          cat body.md
      # 至少一个桌面平台有 updater 签名时，生成自动更新清单 latest.json
      # 并随 Release 上传（客户端 updater 端点即该资产的直链）；
      # 清单按实际可用平台生成（如 macOS 未配 Apple 签名则不含 darwin 条目）
      - name: 生成 latest.json（自动更新清单）
        if: |
          needs.desktop-windows.outputs.updater == 'true' ||
          needs.desktop-linux.outputs.updater == 'true' ||
          needs.desktop-macos.outputs.updater == 'true'
        env:
          REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${REPO}/releases/download/v${VERSION}"
          ARGS="--version $VERSION --apk ${BASE}/PlanWave_${VERSION}_universal.apk --apk-sha256 $(sha256sum "upload/PlanWave_${VERSION}_universal.apk" | cut -d' ' -f1) --notes-file body.md --out upload/latest.json"
          if [ "${{ needs.desktop-windows.outputs.updater }}" = "true" ]; then
            ARGS="$ARGS --win ${BASE}/PlanWave_${VERSION}_x64-setup.exe --win-sig upload/PlanWave_${VERSION}_x64-setup.exe.sig"
          fi
          if [ "${{ needs.desktop-macos.outputs.updater }}" = "true" ]; then
            ARGS="$ARGS --mac ${BASE}/PlanWave_${VERSION}_aarch64.app.tar.gz --mac-sig upload/PlanWave_${VERSION}_aarch64.app.tar.gz.sig"
          fi
          if [ "${{ needs.desktop-linux.outputs.updater }}" = "true" ]; then
            ARGS="$ARGS --linux ${BASE}/PlanWave_${VERSION}_amd64.AppImage --linux-sig upload/PlanWave_${VERSION}_amd64.AppImage.sig"
          fi
          node scripts/gen-latest-json.mjs $ARGS
          cat upload/latest.json
      - name: 未配置 updater 签名提示
        if: |
          needs.desktop-windows.outputs.updater != 'true' &&
          needs.desktop-linux.outputs.updater != 'true' &&
          needs.desktop-macos.outputs.updater != 'true'
        run: |
          echo "::notice::未配置 TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)（见 docs/AUTO_UPDATE.md），本次跳过 latest.json 生成，桌面自动更新不可用"
      - name: 上传到 Release
        uses: softprops/action-gh-release@v3
        with:
          # 草稿态：维护者核对产物与更新说明后手动 Publish；
          # 草稿不出现在 releases/latest 端点，发布前 latest.json 对客户端不可见
          draft: true
          files: upload/*
          body_path: body.md
          generate_release_notes: true
